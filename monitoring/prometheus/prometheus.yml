# DataGate Prometheus 采集配置（docs/09 §9，M6-02）
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: datagate
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: datagate-admin
