name: DataGate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 编译与单元测试（@Tag("unit") 的纯单元测试在所有环境运行；真实引擎集成测试在独立 job）
      - name: Build & unit test
        run: mvn clean install -B -DskipTests=false

      # SBOM（docs/00 第 4.2 节：依赖清单、镜像和驱动均需在 CI 生成 SBOM）
      # 非关键：插件版本/网络问题不阻断编译+单测（与漏洞报告一致 continue-on-error）
      - name: Generate SBOM
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -B -DskipTests
        continue-on-error: true

      # 依赖漏洞与许可证报告（failOnCVSS 先告警不阻断，高危处置走 docs/10 发布门禁）
      - name: Dependency vulnerability & license report
        run: mvn org.owasp:dependency-check-maven:check -B -DskipTests -Dformats=HTML,JSON -DfailOnCVSS=11
        continue-on-error: true

      - name: Upload SBOM & reports
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-security-reports
          path: |
            **/target/bom.json
            **/target/dependency-check-report.*
          retention-days: 30
