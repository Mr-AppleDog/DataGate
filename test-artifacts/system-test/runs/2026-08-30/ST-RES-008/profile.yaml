platform:
  name: "DataGate"
  repository_root: "E:/github-reposit/DataGate"
  documentation:
    - "docs/01-产品需求规格说明书.md:174"
    - "docs/05-API错误码与状态机规范.md:28"
    - "docs/08-安全审计与威胁模型.md"

environment:
  kind: "local"
  base_url: "http://localhost"
  api_base_url: "http://localhost/dev-api"
  build_or_commit: "8e94aea"
  startup_command: "already running"

api:
  auth_method: "unauthenticated negative check; no browser credentials exported"
  client_or_harness: "PowerShell Invoke-WebRequest"
  safe_mutations_allowed: false
  redaction_rules: ["authorization", "cookie", "password", "token", "secret", "personal-data", "private-host", "ciphertext", "nonce"]

browser:
  family: "edge"
  use_existing_session: true
  route: "/data-assets/datasources"

authorization:
  permitted_roles: ["existing authenticated administrator session"]
  forbidden_actions: ["add credential", "enter password", "test connection", "disable credential", "session export"]
  production_writes_allowed: false

issue_tracking:
  provider: "github"
  repository: "Mr-AppleDog/DataGate"
  mode: "submit_authorized"
  duplicate_reference: "Issue #1 covers the observed generic authentication HTTP mapping symptom"

scope:
  run_mode: "focused feature"
  module: "credential metadata read boundary"
  critical_journeys: ["credential metadata is visible without credential secret material"]
  included_areas: ["unauthenticated credential list denial", "administrator credential metadata panel"]
  excluded_areas: ["credential creation", "connection testing", "credential disable/rotation"]
  test_data: "existing smoke-mysql credential only; no mutation"

evidence:
  output_directory: "E:/github-reposit/DataGate/test-artifacts/system-test/runs/2026-08-30/ST-RES-008"
  redact: ["credentials", "tokens", "personal-data", "cookies", "session-storage", "private-host", "password", "ciphertext", "nonce"]
