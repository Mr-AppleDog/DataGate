platform:
  name: "DataGate"
  repository_root: "E:/github-reposit/DataGate"
  documentation:
    - "docs/01-产品需求规格说明书.md:174"
    - "docs/05-API错误码与状态机规范.md:28"
    - "docs/05-API错误码与状态机规范.md:221"

environment:
  kind: "local"
  base_url: "http://localhost"
  api_base_url: "http://127.0.0.1:8080"
  build_or_commit: "8e94aea"
  startup_command: "already running"
  feature_flags: []

api:
  auth_method: "unauthenticated negative check; no browser credentials exported"
  client_or_harness: "PowerShell Invoke-WebRequest"
  safe_mutations_allowed: false
  redaction_rules: ["authorization", "cookie", "password", "token", "secret", "personal-data", "private-host"]

browser:
  family: "edge"
  use_existing_session: true
  route: "/data-assets/datasources"

authorization:
  permitted_roles: ["existing authenticated administrator session"]
  forbidden_actions: ["application data writes", "credential inspection", "session export", "GitHub issue comments/labels/assignees/closures"]
  production_writes_allowed: false

issue_tracking:
  provider: "github"
  repository: "Mr-AppleDog/DataGate"
  mode: "submit_authorized"
  publication_confirmed: true
  duplicate_reference: "Issue #1 covers the same HTTP authentication mapping symptom"

scope:
  run_mode: "focused feature"
  module: "resource datasource list"
  critical_journeys: ["resource discovery authorization and datasource name filtering"]
  included_areas: ["unauthenticated datasource list denial", "administrator Edge name filter"]
  excluded_areas: ["create/edit/verify/enable/sync datasource", "credentials", "query execution"]
  test_data: "existing records only; no mutation"

evidence:
  output_directory: "E:/github-reposit/DataGate/test-artifacts/system-test/runs/2026-08-30/ST-RES-007"
  redact: ["credentials", "tokens", "personal-data", "cookies", "session-storage", "private-host"]
