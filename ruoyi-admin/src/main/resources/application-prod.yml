# =============================================================================
# DataGate 生产配置样例（M0-03）
#
# 强制要求（docs/10 第 13.1 节禁止上线项）：
# - 禁止默认密钥、默认密码、样例账号；本文件所有秘密均经环境变量注入，缺失即启动失败（失败关闭）
# - 元数据库 = PostgreSQL；平台缓存/锁 = Valkey（Redis 协议）
# - 生产关闭 Swagger 公共访问、P6Spy、非必要 Actuator 端点
# - 仅允许办公网/公司内网/VPN 访问（由 Nginx/SLB 层实现，不在本文件）
# =============================================================================

--- # 临时文件存储位置 避免临时文件被系统清理报错
spring.servlet.multipart.location: /ruoyi/server/temp

--- # 监控中心配置（M6 部署后开启）
spring.boot.admin.client:
  enabled: false
  url: ${DATAGATE_ADMIN_SERVER_URL:http://127.0.0.1:9090/admin}
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${DATAGATE_MONITOR_USERNAME:}
  password: ${DATAGATE_MONITOR_PASSWORD:}

--- # snail-job 配置（M4 启用）
snail-job:
  enabled: false
  group: "datagate_group"
  token: ${DATAGATE_SNAILJOB_TOKEN:}
  server:
    host: ${DATAGATE_SNAILJOB_HOST:127.0.0.1}
    port: 17888
  namespace: ${spring.profiles.active}
  port: 2${server.port}
  host:

--- # 数据源配置（平台元数据库：PostgreSQL；仅存配置/授权/审计，不存查询结果）
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      # 生产禁止 P6Spy 输出 SQL 正文（docs/02 第 2 节）
      p6spy: false
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://${DATAGATE_DB_HOST}:${DATAGATE_DB_PORT:5432}/${DATAGATE_DB_NAME:datagate}?stringtype=unspecified&currentSchema=public&sslmode=${DATAGATE_DB_SSLMODE:require}
          username: ${DATAGATE_DB_USERNAME:}
          password: ${DATAGATE_DB_PASSWORD:}
      hikari:
        maxPoolSize: 20
        minIdle: 10
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000

--- # Valkey/Redis 协议缓存（docs/00 第 4.2 节：默认 Valkey BSD-3-Clause，Redisson 客户端）
spring.data:
  redis:
    host: ${DATAGATE_REDIS_HOST:127.0.0.1}
    port: ${DATAGATE_REDIS_PORT:6379}
    database: 0
    password: ${DATAGATE_REDIS_PASSWORD:}
    timeout: 10s
    ssl.enabled: ${DATAGATE_REDIS_SSL:false}

# redisson 配置
redisson:
  keyPrefix:
  threads: 16
  nettyThreads: 32
  singleServerConfig:
    clientName: DataGate
    connectionMinimumIdleSize: 32
    connectionPoolSize: 64
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送（M4 告警通道启用前保持关闭）
mail:
  enabled: false
  host: ${DATAGATE_MAIL_HOST:}
  port: 465
  auth: true
  from: ${DATAGATE_MAIL_FROM:}
  user: ${DATAGATE_MAIL_USER:}
  pass: ${DATAGATE_MAIL_PASS:}
  starttlsEnable: true
  sslEnable: true
  timeout: 0
  connectionTimeout: 0

--- # sms 短信（DataGate 首版只提供本地账号登录，不使用短信/社交登录）
sms:
  config-type: yaml
  restricted: true
  minute-max: 1
  account-max: 30
  blends: {}

--- # 三方授权（DataGate 首版不使用，仅保留 SPI 扩展点）
justauth:
  address: ${DATAGATE_WEB_ADDRESS:http://127.0.0.1}
  type: {}

--- # 生产安全收口（docs/10 M0-02）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产限制 Actuator 暴露面
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: NEVER

# api 接口加密密钥：生产必须经环境变量注入（与前端部署配套轮换）
api-decrypt:
  enabled: true
  headerFlag: encrypt-key
  publicKey: ${DATAGATE_API_DECRYPT_PUBLIC_KEY:}
  privateKey: ${DATAGATE_API_DECRYPT_PRIVATE_KEY:}

# Sa-Token JWT 密钥：生产必须经环境变量注入
sa-token:
  jwt-secret-key: ${DATAGATE_JWT_SECRET:}
