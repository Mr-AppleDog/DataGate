--- # 监控中心配置（SnailJob/Admin Server 未部署，M0 关闭客户端；M4/M6 部署后开启）
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false
  url: http://192.168.149.128:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: @monitor.username@
  password: @monitor.password@

--- # snail-job 配置（M0：调度服务端未部署，客户端关闭；任务经 SnailJob 接入时在 M4 开启）
snail-job:
  enabled: false
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "ruoyi_group"
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config` 表
  token: "SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT"
  server:
    host: 192.168.149.128
    port: 17888
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # 数据源配置（DataGate 基线：元数据库=PostgreSQL，docs/02 第 4.1 节）
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用；仅允许用于平台元数据库开发诊断)
      p6spy: false
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源（平台元数据库，仅存配置/授权/审计，不存查询结果）
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://192.168.149.128:5432/datagate?stringtype=unspecified&currentSchema=public
          username: postgres
          password: mrlu
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: 192.168.149.128
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # redis 密码必须配置
    password: mrlu
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: RuoYi-Vue-Plus
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送（M4 告警通道启用前保持关闭）
mail:
  enabled: false

--- # sms 短信（DataGate 首版只提供本地账号登录，不使用短信/社交登录；docs/00 第 3.2 节）
sms:
  config-type: yaml
  restricted: true
  minute-max: 1
  account-max: 30
  blends: {}

--- # 三方授权（DataGate 首版不使用，仅保留 SPI 扩展点）
justauth:
  address: http://localhost:80
  type: {}

--- # DataGate 安全底座（M1）
datagate:
  security:
    credential:
      # 开发环境本地 KEK 文件（仅开发用，生产必须为只读 Secret 挂载；本路径不得进 Git）
      kek-file: ${DATAGATE_KEK_FILE:C:\\Users\\cxy784853792\\.datagate\\kek.txt}
